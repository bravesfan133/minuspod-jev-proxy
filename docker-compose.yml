# Canonical compose file (local + Dockhand).
# Local: cp .env.example .env, fill keys, then `docker compose up -d --build`.
# Dockhand: point the stack at this repo and set the same variables in
# Dockhand's environment UI (JEV_PRIMARY_API_KEY at minimum).
services:
  minuspod-jev-proxy:
    build: .
    container_name: minuspod-jev-proxy
    # Root so the mounted Docker socket can pause and unpause MinusPod.
    # The process only calls pause, unpause, and inspect on JEV_MINUSPOD_CONTAINER.
    user: "0:0"
    ports:
      - "8787:8787"
    volumes:
      - ${JEV_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${PORT:-8787}
      - JEV_PRIMARY_BASE_URL=${JEV_PRIMARY_BASE_URL:-https://api.typesafe.ai/v1/systemone}
      - JEV_PRIMARY_MODEL=${JEV_PRIMARY_MODEL:-jev-latest}
      - JEV_PRIMARY_API_KEY=${JEV_PRIMARY_API_KEY:-}
      - JEV_SECONDARY_BASE_URL=${JEV_SECONDARY_BASE_URL:-https://opencode.ai/zen/v1/systemone}
      - JEV_SECONDARY_MODEL=${JEV_SECONDARY_MODEL:-jev-1.13-free}
      - JEV_SECONDARY_API_KEY=${JEV_SECONDARY_API_KEY:-}
      # Optional third backend. Empty means the slot is skipped, and the
      # primary -> secondary order is unchanged. Adding a provider here must
      # never displace the keyless free tier above.
      - JEV_TERTIARY_BASE_URL=${JEV_TERTIARY_BASE_URL:-}
      - JEV_TERTIARY_MODEL=${JEV_TERTIARY_MODEL:-}
      - JEV_TERTIARY_API_KEY=${JEV_TERTIARY_API_KEY:-}
      - JEV_TIMEOUT_SECS=${JEV_TIMEOUT_SECS:-60}
      # Detection is two stages: a permissive recall gate that decides whether
      # a candidate exists, then edge trim that tightens the bounds. One
      # threshold cannot do both jobs.
      - JEV_RECALL_THRESHOLD=${JEV_RECALL_THRESHOLD:-0.35}
      - JEV_EDGE_THRESHOLD=${JEV_EDGE_THRESHOLD:-0.50}
      - JEV_EDGE_PIECE_SECS=${JEV_EDGE_PIECE_SECS:-2}
      - JEV_EDGE_CONTEXT_SECS=${JEV_EDGE_CONTEXT_SECS:-45}
      - JEV_ATTACH_THRESHOLD=${JEV_ATTACH_THRESHOLD:-0.40}
      - JEV_ATTACH_GAP_SECS=${JEV_ATTACH_GAP_SECS:-8}
      - JEV_REVIEW_THRESHOLD=${JEV_REVIEW_THRESHOLD:-0.5}
      - JEV_SEGMENT_TARGET_SECS=${JEV_SEGMENT_TARGET_SECS:-4}
      - JEV_SEGMENT_MAX_SECS=${JEV_SEGMENT_MAX_SECS:-8}
      - JEV_SEGMENT_GAP_SECS=${JEV_SEGMENT_GAP_SECS:-1.25}
      - JEV_MAX_SEGMENTS_PER_CALL=${JEV_MAX_SEGMENTS_PER_CALL:-16}
      - JEV_MAX_CONCURRENT_REQS=${JEV_MAX_CONCURRENT_REQS:-4}
      # 402/billing parks that backend for this long. Daily quota (Clef 4006,
      # Zen free-tier caps) parks it until the next 00:00 UTC instead.
      - JEV_BILLING_DEAD_SECS=${JEV_BILLING_DEAD_SECS:-1800}
      # MinusPod's openai-compatible client times out at 600s unless
      # llm_timeout_seconds is set. A held request is only kept open when
      # the wait fits inside this.
      - JEV_CLIENT_TIMEOUT_SECS=${JEV_CLIENT_TIMEOUT_SECS:-600}
      - JEV_HOLD_MARGIN_SECS=${JEV_HOLD_MARGIN_SECS:-30}
      - JEV_MINUSPOD_CONTAINER=${JEV_MINUSPOD_CONTAINER:-minuspod}
      - JEV_DOCKER_SOCKET=${JEV_DOCKER_SOCKET:-/var/run/docker.sock}
    restart: unless-stopped
